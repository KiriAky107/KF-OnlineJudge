[package]
name = "kf-sandbox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
kf-contracts.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
rustix = { version = "1.1.5", features = ["net", "process", "fs", "thread", "mount", "system", "stdio"] }

# Fixed BPF compilation/installation through safe APIs; libc supplies syscall
# numbers only. Both dependencies stay inside the OS sandbox boundary.
seccompiler = { version = "=0.5.0", default-features = false }
libc = "=0.2.190"

[lints]
workspace = true

[[example]]
name = "identity_probe"
test = false
