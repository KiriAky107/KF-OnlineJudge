[workspace]
members = [
    "crates/contracts",
    "crates/sandbox",
    "crates/engine",
    "crates/worker",
    "crates/coordinator",
]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.99"
license = "MIT"

[workspace.dependencies]
kf-contracts = { path = "crates/contracts" }
kf-sandbox = { path = "crates/sandbox" }
kf-engine = { path = "crates/engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
axum = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
